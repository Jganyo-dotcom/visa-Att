<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <title>Manage People | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Core Page Stylesheet -->
    <link rel="stylesheet" href="database.css" />
    <!-- 1. Global Component Stylesheet Link -->
    <link rel="stylesheet" href="global-sidebar.css" />
  </head>
  <body>
    <!-- Shared Header -->
    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">DATABASE</h1>
      </div>
      <div class="header-right">
        <!-- 2. Integrated unified right-aligned hamburger navigation button -->
        <button
          id="hamburgerBtn"
          class="hamburger"
          aria-label="Open Navigation"
        >
          &#9776;
        </button>
      </div>
    </header>

    <!-- Note: The sidebar HTML markup is now generated dynamically via global-sidebar.js -->

    <!-- Page-specific content -->
    <main>
      <h2>
        🗄️📊 Database
        <div class="stats">
          <span id="number"></span>
          <span id="females"></span>
          <span id="males"></span>
        </div>
      </h2>

      <div class="attendance-controls">
        <input type="text" id="searchInput" placeholder="Search member..." />
        <button id="refreshit">Refresh</button>
      </div>

      <div class="table-container">
        <table class="attendance-table">
          <tbody id="attendanceList">
            <!-- rows injected here -->
          </tbody>
        </table>
      </div>

      <div id="attendancePagination"></div>
      <p id="attendanceMessage"></p>
    </main>

    <!-- Shared Footer -->
    <footer>
      <p>© 2026 Attendance App. Created by <strong>Elikem</strong>.</p>
      <p>
        <a href="mailto:elikemejay@gmail.com">📧 Email</a> |
        <a href="tel:0593320375"> 📞 Call</a>
      </p>
      <div class="social-links">
        <a
          href="https://www.linkedin.com/in/james-ganyo-aa0593360"
          target="_blank"
          >LinkedIn</a
        >
        <a href="https://wa.me/233503841074" target="_blank">WhatsApp</a>
        <a href="https://github.com/Jganyo-dotcom/" target="_blank">GitHub</a>
      </div>
    </footer>

    <!-- Interactive Overlay Modal Structure (Aligned to match global-sidebar.js targets) -->

      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>

            <input type="password" id="currentPassword" required />
          </div>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required />
          </div>
          <button type="submit" class="btn-primary">Update Password</button>
        </form>
      </div>
    </div> -->

    <!-- Report Modal -->
    <div id="reportModal" class="modal">
      <div class="Modal-content">
        <h2 class="Modal-title">Attendance Report</h2>

        <!-- Date selector -->
        <div class="form-group">
          <label for="reportDate">Select Date</label>
          <input type="date" id="reportDate" required />
        </div>

        <!-- Action buttons -->
        <div class="button-group">
          <button id="checkReportBtn" class="btn btn-primary">
            Check Attendance
          </button>
          <button id="checkHistoryBtn" class="btn btn-secondary">
            View Full Attendance History
          </button>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader" style="display: none">
          🔄 Searching attendance...
        </div>

        <!-- Results -->
        <div id="reportResult" class="report-result"></div>

        <!-- Close button -->
        <div class="modal-footer">
          <button onclick="closeReportModal()" class="btn btn-danger">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- QR Modal -->
    <div id="qrModal" class="modal" style="display: none">
      <div class="modal-content">
        <h2>QR Code</h2>
        <div id="qrcode"></div>
        <br /><br /><br />
        <button onclick="closeQrModal()" class="btn btn-danger">Close</button>
      </div>
    </div>

    <!-- Update Modal -->
    <div id="updateModal" class="modal" style="display: none">
      <div class="modal-content">
        <span id="closeModall" class="close">&times;</span>
        <h2>Update User</h2>
        <form id="updateForm">
          <input id="updateId" readonly />

          <label>Name</label>
          <input type="text" id="updateName" />

          <label>Department</label>
          <p id="temp"></p>
          <select id="updateDepartment" required>
            <option value="">-- Department --</option>
            <option value="Counselling">Counselling</option>
            <option value="Prayer">Prayer</option>
            <option value="Divine Ex">Divine Ex</option>
            <option value="Ushering">Ushering</option>
            <option value="Technical">Technical</option>
            <option value="Welfare">Welfare</option>
            <option value="Media">Media</option>
            <option value="Music">Music</option>
            <option value="Outreach">Outreach</option>
            <option value="School of the word">School of The Word</option>
            <option value="Protocol">Protocol</option>
            <option value="Instrumantalist">Instrumantalist</option>
            <option value="DODept">Digital Operations Department</option>
          </select>

          <label>Level</label>
          <select id="updateLevel" required>
            <option value="">-- Level --</option>
            <option value="L 100">L 100</option>
            <option value="L 200">L 200</option>
            <option value="L 300">L 300</option>
            <option value="L 400">L 400</option>
            <option value="5th year">5th year</option>
            <option value="6th year">6th year</option>
            <option value="Masters">Masters</option>
          </select>
          <select id="updategender" required>
            <option value="">-- Gender --</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>

          <label>Contact</label>
          <input type="text" id="updateContact" />

          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>

    <!-- 3. Dynamic Side-drawer Engine Component Execution script -->
    <script src="global-sidebar.js"></script>
    <!-- Core layout page specific logic execution -->
    <script src="database.js"></script>
  </body>
</html>
