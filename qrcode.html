<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Attendance Scanner | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="stylesheet" href="analysis.css" />
    <link rel="stylesheet" href="global-sidebar.css" />
    <link rel="stylesheet" href="components.css" />

    <script src="https://unpkg.com/html5-qrcode"></script>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">QR Attendance Scanner</h1>
      </div>
      <div class="header-right">
        <button
          id="hamburgerBtn"
          class="hamburger"
          aria-label="Open Navigation"
        >
          &#9776;
        </button>
      </div>
    </header>

    <main>
      <div class="grid">
        <button id="openScannerBtn" class="btn btn-primary">
          📷 Scan Attendance QR
        </button>

        <div id="scannerModal" class="modal" style="display: none">
          <div class="modal-content">
            <h2>Scan QR Code</h2>
            <div id="qr-reader" style="width: 300px; margin: auto"></div>
            <div id="scan-result" class="scan-result"></div>
            <button onclick="closeScanner()" class="btn btn-danger">
              Close
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="passwordModal" class="slide-modal">
      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>
      </div>
    </div>

    <footer>
      <div class="footer-content">
        <p class="copyright">
          © 2026 Attendance App. Created by <strong>Elikem</strong>.
        </p>
        <div class="contact-methods">
          <a href="mailto:elikemejay@gmail.com" class="contact-link"
            >📧 Email</a
          >
          <span class="divider">|</span>
          <a href="tel:0593320375" class="contact-link">📞 Call</a>
        </div>
        <div class="social-links">
          <a
            href="https://www.linkedin.com/in/james-ganyo-aa0593360"
            target="_blank"
            rel="noopener"
            >LinkedIn</a
          >
          <a href="https://wa.me/233503841074" target="_blank" rel="noopener"
            >WhatsApp</a
          >
          <a
            href="https://github.com/Jganyo-dotcom/"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
        </div>
      </div>
    </footer>

    <script src="global-sidebar.js"></script>
    <script src="qrcode.js"></script>
  </body>
</html>
