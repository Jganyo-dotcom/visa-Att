<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Core Page Stylesheet -->
    <link rel="stylesheet" href="analysis.css" />
    <!-- 1. Global Component Stylesheet Link -->
    <link rel="stylesheet" href="global-sidebar.css" />
  </head>
  <body>
    <!-- Shared Header -->
    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">Analysis</h1>
      </div>
      <div class="header-right">
        <!-- 2. Integrated unified right-aligned hamburger navigation button -->
        <button id="hamburgerBtn" class="hamburger" aria-label="Open Navigation">&#9776;</button>
      </div>
    </header>

    <!-- Note: The sidebar HTML markup is now generated dynamically via global-sidebar.js -->

    <!-- Page-specific content -->
    <main>
      <h2>🗄️📊 Analysis</h2>

      <!-- Date selector -->
      <label for="reportDate">Select Date:</label>
      <input type="date" id="reportDate" />
      <button id="loadReportBtn">Load Report</button>

      <!-- Charts -->
      <div style="width: 400px; margin-top: 20px">
        <canvas id="dailyPie"></canvas>
      </div>
      <div style="width: 400px; margin-top: 20px">
        <canvas id="dailyBar"></canvas>
      </div>

      <!-- Female chart -->
      <div style="width: 400px; margin-top: 20px">
        <canvas id="femalePie"></canvas>
      </div>

      <!-- Male chart -->
      <div style="width: 400px; margin-top: 20px">
        <canvas id="malePie"></canvas>
      </div>
    </main>

    <!-- Interactive Overlay Modal Structure (Aligned to match global-sidebar.js targets) -->
    <div id="passwordModal" class="slide-modal">
      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>
        <!-- Modal body form fields live here -->
      </div>
    </div>

    <!-- Shared Footer -->
    <footer>
      <p>© 2026 Attendance App. Created by <strong>Elikem</strong>.</p>
      <p>
        <a href="mailto:elikemejay@gmail.com">📧 Email</a> |
        <a href="tel:0593320375"> 📞 Call</a>
      </p>
      <div class="social-links">
        <a
          href="https://www.linkedin.com/in/james-ganyo-aa0593360"
          target="_blank"
          >LinkedIn</a
        >
        <a href="https://wa.me/233503841074" target="_blank">WhatsApp</a>
        <a href="https://github.com/Jganyo-dotcom/" target="_blank">GitHub</a>
      </div>
    </footer>

    <!-- 3. Dynamic Side-drawer Engine Component Execution script -->
    <script src="global-sidebar.js"></script>
    <!-- Core layout page specific logic execution -->
    <script src="analysis.js"></script>
  </body>
</html>
