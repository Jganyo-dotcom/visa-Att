<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Dashboard | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="stylesheet" href="temp.css" />
    <link rel="stylesheet" href="global-sidebar.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f464.svg"
          alt="User Profile"
          class="logo"
          id="globalHeaderAvatar"
          style="opacity: 0; transition: opacity 0.15s ease"
        />
        <h1 id="welcome">Admin Dashboard</h1>
      </div>
      <div class="header-right">
        <button
          id="hamburgerBtn"
          class="hamburger"
          aria-label="Open Navigation"
        >
          &#9776;
        </button>
      </div>
    </header>

    <main class="grid">
      <section>
        <h2>➕ Create Person</h2>
        <form id="createPersonForm" class="form-card">
          <div id="newMemberBanner" class="new-member-banner">
            ✨ Welcome! This person is marked as a New Member.
          </div>
          <div class="form-group">
            <input type="text" id="name" placeholder="Full Name" required />
          </div>

          <div class="form-group">
            <select id="department" required>
              <option value="">-- Department --</option>
              <option value="Counselling">Counselling</option>
              <option value="Prayer">Prayer</option>
              <option value="Divine Ex">Divine Ex</option>
              <option value="Ushering">Ushering</option>
              <option value="Technical">Technical</option>
              <option value="Welfare">Welfare</option>
              <option value="Media">Media</option>
              <option value="Music">Music</option>
              <option value="Outreach">Outreach</option>
              <option value="School of the word">School of The Word</option>
              <option value="Protocol">Protocol</option>
              <option value="Instrumantalist">Instrumantalist</option>
              <option value="DODept">Digital Operations Department</option>
            </select>
          </div>

          <div id="loaderOverlay" class="loader-overlay">
            <div class="loader">
              <div class="spinner"></div>
              <span class="loading-text">Creating Person...</span>
            </div>
          </div>

          <div class="form-group">
            <select id="gender" required>
              <option value="">-- Gender --</option>
              <option value="F">Female</option>
              <option value="M">Male</option>
            </select>
          </div>

          <div class="form-group">
            <select id="VisaLevels" required>
              <option value="">-- Level --</option>
              <option value="L 100">L 100</option>
              <option value="L 200">L 200</option>
              <option value="L 300">L 300</option>
              <option value="L 400">L 400</option>
              <option value="5th yesr">5th year</option>
              <option value="6th year">6th year</option>
              <option value="Masters">Masters</option>
            </select>
          </div>

          <div class="form-group">
            <input type="text" id="contact" placeholder="Contact" />
          </div>
          <div class="form-group toggle-container">
            <label class="switch">
              <input type="checkbox" id="isNewMemberToggle" />
              <span class="slider round"></span>
            </label>
            <span class="toggle-label">Is this a new member?</span>
          </div>

          <button type="submit" class="btn-primary">Create Person</button>
        </form>
      </section>
    </main>

    <div id="ios-loader" class="loader-overlay">
      <div class="loader">
        <div class="spinner"></div>
        <span class="loading-text">Processing Request...</span>
      </div>
    </div>

    </footer>
