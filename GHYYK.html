<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Report | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <link rel="stylesheet" href="GH.CSS" />
    <link rel="stylesheet" href="global-sidebar.css" />
  </head>
  <body>
    

    <main>
      <section class="controls">
        <label for="dayOne">Day One Date:</label>
        <input type="date" id="dayOne" />

        <label for="dayTwo">Day Two Date:</label>
        <input type="date" id="dayTwo" />

        <label for="statusOne">Status One:</label>
        <input type="text" id="statusOne" placeholder="P" />

        <label for="statusTwo">Status Two:</label>
        <input type="text" id="statusTwo" placeholder="A" />

        <button id="loadBtn" class="btn btn-primary">Compare Attendance</button>

        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search attendance..."
          class="search-box"
        />
      </section>

      <section id="attendanceContainer">
        <div class="attendance-wrapper" id="attendance-wrapper">
          </div>
      </section>
    </main>

    <!-- <div id="passwordModal" class="slide-modal">
      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>
        </div>
    </div> -->

    

    <script src="global-sidebar.js"></script>
    <script src="GY.js"></script>
  </body>
</html>
