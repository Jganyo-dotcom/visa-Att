<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Hub | Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="brand">
        <h1>ELIKEM <span class="accent">COLLECTIONS</span></h1>
        <div class="status-indicator">
          <span class="dot"></span>
          <p>Software Portfolio 2026</p>
        </div>
      </div>
    </header>
    <main class="dashboard-wrapper">
      <section class="card-grid">
        <!-- Card: Attendance App -->
        <a href="/auth.html" class="glass-card">
          <div
            class="card-bg"
            style="
              background-image: url(&quot;https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?auto=format&fit=crop&q=80&w=600&quot;);
            "
          ></div>
          <div class="card-overlay">
            <div class="card-text">
              <h2>Attendance App</h2>
              <p>Real-time logs & management systems.</p>
            </div>
            <span class="btn-shine">Launch App</span>
          </div>
        </a>

        <!-- Card: The Mart -->
        <a href="https://elimart.netlify.app/" class="glass-card">
          <div
            class="card-bg"
            style="
              background-image: url(&quot;https://images.unsplash.com/photo-1534452203294-49c8913721b2?auto=format&fit=crop&q=80&w=600&quot;);
            "
          ></div>
          <div class="card-overlay">
            <div class="card-text">
              <h2>The Mart</h2>
              <p>Browse premium products and offers.</p>
            </div>
            <span class="btn-shine">Shop Now</span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
