<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin Dashboard</title>
    <link rel="stylesheet" href="manager.css" />
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>

    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">Super Admin Dashboard</h1>
      </div>
      <div class="header-right">
        <div class="desktop-actions">
          <button id="openChangePassword" class="btn-secondary">Change Password</button>
          <button id="SignOutBtn" class="btn-signout">Sign Out</button>
        </div>
        <button id="mobileMenuBtn" class="hamburger-toggle" aria-label="Toggle Actions Menu">
          &#9776;
        </button>
      </div>
    </header>

    <div id="mobileDrawer" class="drawer-overlay">
      <div class="drawer-content">
        <div class="drawer-header">
          <h3>Account Actions</h3>
          <button id="closeDrawerBtn" class="close-modal">&times;</button>
        </div>
        <div class="drawer-body">
          <button id="openChangePasswordMobile" class="btn-secondary drawer-btn">Change Password</button>
          <button id="SignOutBtnMobile" class="btn-signout drawer-btn">Sign Out</button>
        </div>
      </div>
    </div>

    <main>
      <section>
        <h2>➕ Add New Admin</h2>
        <form id="addAdminForm" class="form-card">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required />
          </div>
          <div class="form-group">
            <label for="org">Organization</label>
            <input type="text" id="org" required />
          </div>
          <button type="submit" class="btn-primary">Add Admin</button>
        </form>
      </section>

      <section>
        <h2>👥 All Admins</h2>
        <div class="table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Organization</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="adminList"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="changePasswordModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close-modal">&times;</span>
        <h2>Change Password</h2>
        <form id="changePasswordForm" class="form-card">
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required />
          </div>
          <button type="submit" class="btn-primary">Update Password</button>
        </form>
      </div>
    </div>

    <footer>
      <p>© 2026 Attendance App. Created by <strong>Elikem</strong>.</p>
      <p>
        <a href="mailto:elikemejay@gmail.com">📧 Email</a> |
        <a href="tel:0593320375"> 📞 Call</a>
      </p>
    </footer>

    <script src="manager.js"></script>
  </body>
</html>
