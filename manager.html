<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin Dashboard</title>
    <link rel="stylesheet" href="manager.css" />
    <link rel="icon" type="image/png" href="/logo.png">
  </head>
  <body>

    <!-- Global Loading Overlay -->
    <div id="loaderrOverlay" class="loader-overlay" style="display: none;">
      <div class="spinner"></div>
    </div>

    <!-- Header Block -->
    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">Super Admin Dashboard</h1>
      </div>
      <div class="header-right">
        <button id="openChangePassword" class="btn-secondary">Change Password</button>
        <button id="openSignOutModal" class="btn-signout">Sign Out</button>
      </div>
    </header>

    <!-- Main Content Area Grid -->
    <main>
      <!-- Panel 1: Creation Form -->
      <section class="panel-form">
        <h2>➕ Add New Admin</h2>
        <form id="addAdminForm" class="form-card">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required />
          </div>
          <div class="form-group">
            <label for="org">Organization</label>
            <input type="text" id="org" required />
          </div>
          <button type="submit" class="btn-primary">Add Admin</button>
        </form>
      </section>

      <!-- Panel 2: Table Registry -->
      <section class="panel-table">
        <h2>👥 All Admins</h2>
        <div class="table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Organization</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="adminList"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Change Password Modal -->
    <!-- <div id="changePasswordModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close-modal">&times;</span>
        <h2>Change Password</h2>
        <form id="changePasswordForm" class="form-card">
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required />
          </div>
          <button type="submit" class="btn-primary">Update Password</button>
        </form>
      </div>
    </div> -->

    <!-- Sign Out Confirmation Modal -->
    <div id="signOutModal" class="modal">
      <div class="modal-content text-center">
        <h2>Sign Out</h2>
        <p>Are you sure you want to log out of your super admin dashboard session?</p>
        <div class="modal-actions">
          <button id="confirmSignOutBtn" class="btn-danger-filled">Sign Out</button>
          <button id="closeSignOutModal" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Layout Footer -->
    <footer>
      <p>© 2026 Attendance App. Created by <strong>Elikem</strong>.</p>
      <p>
        <a href="mailto:elikemejay@gmail.com">📧 Email</a> |
        <a href="tel:0593320375"> 📞 Call</a>
      </p>
    </footer>

    <script src="manager.js"></script>
  </body>
</html>
