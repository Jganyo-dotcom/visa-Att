<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Management | Attendance App</title>
    <link rel="stylesheet" href="sessionM.css" />
    <link rel="stylesheet" href="global-sidebar.css" />

  </head>
  <body>
    

    <main>
      <div class="grid-layout">
        <div class="glass-card" id="sessionCard">
          <div class="card-header">
            <h2>Manage Attendance Session</h2>
            <span class="status-badge" id="statusBadge"
              >Checking Server...</span
            >
          </div>

          <div class="card-body">
            <div class="input-group">
              <label for="sessionName">Session Title / Identifier</label>
              <input
                type="text"
                id="sessionName"
                placeholder="e.g., Morning Lecture, Staff Shift..."
                autocomplete="off"
              />
            </div>

            <button
              id="sessionActionBtn"
              class="action-btn state-loading"
              disabled
              onclick="handleSessionToggle()"
            >
              Loading...
            </button>

            <div class="form-divider"></div>

            <div class="security-action-zone">
              <button
                id="generateCodeBtn"
                class="action-btn-secondary"
                onclick="generateAccessCode()"
              >
                Generate Access Code
              </button>
              <div class="display-box">
                <p id="generatedCodeDisplay" class="code-display">
                  No code generated yet.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- <div id="passwordModal" class="slide-modal">
      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>
      </div>
    </div> -->

    <div id="ios-loader" class="loader-overlay-fixed">
      <div class="loader-container">
        <div class="spinner-neon"></div>
        <p id="loaderText">Processing transaction...</p>
      </div>
    </div>

    

    <script src="global-sidebar.js"></script>
    <script src="sessionM.js"></script>
  </body>
</html>
