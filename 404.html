<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Redirecting...</title>
  
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="global-sidebar.css"> <style>
    body {
      background-color: #060913; /* Fits your app's dark theme */
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .redirect-box {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-top-color: #00f2fe; /* Your cyan primary color */
      border-radius: 50%;
      margin: 0 auto 1.5rem auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="redirect-box">
    <div class="spinner"></div>
    <h2>Page Not Found</h2>
    <p style="color: #a3b3cc;">Returning you to safety...</p>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Fire the custom premium Toast notification instantly
      Toastify({
        text: "🔍 The page you requested does not exist. Redirecting...",
        duration: 3000, // Show toast for 3 seconds
        close: true,
        gravity: "top", // top or bottom
        position: "right", // left, center or right
        stopOnFocus: true, // Prevents dismissing of toast on hover
        style: {
          background: "linear-gradient(135deg, #ff007f, #9d4edd)", // Neon pink to electric purple
          color: "#ffffff",
          borderRadius: "12px",
          boxShadow: "0 10px 30px rgba(255, 0, 127, 0.35)",
          fontWeight: "600",
          fontSize: "15px"
        }
      }).showToast();

      // 2. Safe Navigation Redirect Routing Matcher
      const isLocalDev = 
        window.location.hostname === "localhost" || 
        window.location.hostname === "127.0.0.1" || 
        window.location.protocol === "file:";

      // Choose your targeted destination route (e.g., /admin, /landingPage, or index)
      const targetDestination = "/landingPage"; 

      setTimeout(() => {
        window.location.href = isLocalDev ? `${targetDestination}.html` : targetDestination;
      }, 2500); // Redirect slightly before the toast completely vanishes
    });
  </script>
</body>
</html>
