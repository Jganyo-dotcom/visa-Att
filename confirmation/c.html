<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Panel | Admin Access</title>
    <link rel="stylesheet" href="c.css" />
    <link rel="stylesheet" href="../global-sidebar.css" />
    <link rel="stylesheet" href="/components.css" />
  </head>
  <body>

    <main class="container">
      <div class="search-wrapper">
        <h2 class="section-title">Pending Check-In Verifications</h2>
        <p class="section-subtitle">
          Verify user attendance states below to register authentication
          timestamps.
        </p>
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search by name, department, or contact..."
          class="search-bar"
        />
      </div>

      <div id="adminGrid" class="grid-container"></div>
      <div id="paginationControls" class="pagination-controls">
        <button id="prevBtn" disabled>⬅ Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" disabled>Next ➡</button>
      </div>
    </main>

    <div id="loaderOverlay" class="loader-overlay">
      <div class="spinner"></div>
    </div>

    

    <script src="c.js"></script>
    <script src="../global-sidebar.js"></script>
  </body>
</html>
