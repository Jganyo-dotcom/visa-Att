<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png">
    
    <link rel="stylesheet" href="profile.css" />
    <link rel="stylesheet" href="global-sidebar.css" />
  </head>
  <body>
    <header class="animate-fade-in">
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">Admin Profile</h1>
      </div>
      <div class="header-right">
        <button id="hamburgerBtn" class="hamburger" aria-label="Open Navigation">&#9776;</button>
      </div>
    </header>

    <main>
      <section class="profile-card animate-slide-up">
        <h2>👤 Update Profile</h2>
        
        <div class="avatar-container">
          <div class="avatar-wrapper" id="avatarWrapper">
            <img id="avatarPreview" src="http://googleusercontent.com/image_collection/image_retrieval/2446120568034360762_0" alt="Profile Picture" />
            <div class="avatar-overlay">
              <span>📷 Upload</span>
            </div>
          </div>
          <input type="file" id="avatarFileInput" accept="image/png, image/jpeg, image/jpg" style="display: none;" />
          <p class="avatar-hint">Click the image container above to select a custom file photo.</p>
        </div>

        <form id="updateAdminForm" class="form-card">
          <div class="form-group">
            <label for="adminName">Name</label>
            <input type="text" id="adminName" required />
          </div>

          <div class="form-group">
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" required />
          </div>

          <div class="form-group">
            <label for="adminUsername">Username</label>
            <input type="text" id="adminUsername" required />
          </div>

          <div class="form-group">
            <label for="adminOrg">Organisation</label>
            <input type="text" id="adminOrg" placeholder="Organisation..." readonly />
          </div>
          
          <div class="form-group">
            <label for="adminRole">Role</label>
            <input type="text" id="adminRole" placeholder="Role..." readonly />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <button type="button" id="openPasswordModalBtn" class="btn-link">🔑 Change Password</button>
          </div>
        </form>
      </section>
    </main>

    <div id="passwordModal" class="slide-modal">
      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn" aria-label="Close Modal">&times;</button>
        <h2>🔑 Change Password</h2>
        <p class="modal-subtitle">Ensure your account stays secure by choosing a strong credential configuration.</p>
        
        <form id="changePasswordForm">
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required autocomplete="new-password" placeholder="••••••••" />
          </div>
          
          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="••••••••" />
          </div>
          
          <div class="modal-actions">
            <button type="submit" class="btn-primary btn-block">Update Password</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="animate-fade-in">
      <p>© 2026 Attendance App. Created by <strong>Elikem</strong>.</p>
      <p>
        <a href="mailto:elikemejay@gmail.com">📧 Email</a> |
        <a href="tel:0593320375"> 📞 Call</a>
      </p>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/james-ganyo-aa0593360" target="_blank">LinkedIn</a>
        <a href="https://wa.me/233503841074" target="_blank">WhatsApp</a>
        <a href="https://github.com/Jganyo-dotcom/" target="_blank">GitHub</a>
      </div>
    </footer>

    <script src="global-sidebar.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
