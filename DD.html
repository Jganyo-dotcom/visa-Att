<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stayed Report | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="stylesheet" href="DD.css" />
    <link rel="stylesheet" href="global-sidebar.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1>Stayed Report Viewer</h1>
      </div>
      <div class="header-right">
        <button
          id="hamburgerBtn"
          class="hamburger"
          aria-label="Open Navigation"
        >
          &#9776;
        </button>
      </div>
    </header>

    <main>
      <section class="controls">
        <label for="reportDate">Select Date:</label>
        <input type="date" id="reportDate" />

        <button id="loadBtn" class="btn btn-primary">
          Load Stayed Records
        </button>

        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search stayed..."
          class="search-box"
        />
      </section>

      <section id="reportContainer">
        <div id="loader" class="loader" style="display: none"></div>
        <div class="report-wrapper" id="report-wrapper"></div>
      </section>
    </main>
