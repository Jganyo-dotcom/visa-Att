<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stayed Report | Attendance App</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="stylesheet" href="DD.css" />
    <link rel="stylesheet" href="global-sidebar.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    

    <main>
      <section class="controls">
        <label for="reportDate">Select Date:</label>
        <input type="date" id="reportDate" />

        <button id="loadBtn" class="btn btn-primary">
          Load Stayed Records
        </button>

        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search stayed..."
          class="search-box"
        />
      </section>

      <section id="reportContainer">
        <div id="loader" class="loader" style="display: none"></div>
        <div class="report-wrapper" id="report-wrapper"></div>
      </section>
    </main>

        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>
        </div>
    </div> -->

    <script src="global-sidebar.js"></script>
    <script src="DD.js"></script>
  </body>
</html>
