<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Dashboard | Attendance App</title>
    <link rel="icon" type="image/png" href="/l.png" />
    
    <link rel="stylesheet" href="t4.css" />
    <link rel="stylesheet" href="global-sidebar.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="logo.png" alt="Company Logo" class="logo" />
        <h1 id="welcome">Admin Dashboard</h1>
      </div>
      <div class="header-right">
        <button id="hamburgerBtn" class="hamburger" aria-label="Open Navigation">&#9776;</button>
      </div>
    </header>

    <main class="grid">
      <section>
        <h2>👥 Attendance</h2>
        <input type="text" id="searchInput" placeholder="Search member..." />
        <button id="refreshit">Refresh</button>
        <ul id="attendanceList"></ul>
        <div id="attendancePagination"></div>
        <p id="attendanceMessage"></p>
      </section>

      <div class="loader-overlay" id="loaderrOverlay">
        <div class="loader">
          <div class="spinner"></div>
          <span class="loading-text">Loading...</span>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 Attendance App. Created by <strong>Elikem</strong>.</p>
      <p>
        <a href="mailto:elikemejay@gmail.com">📧 Email</a> |
        <a href="tel:0593320375"> 📞 Call</a>
      </p>
      <div class="social-links">
        <a
          href="https://www.linkedin.com/in/james-ganyo-aa0593360"
          target="_blank"
          >LinkedIn</a
        >
        <a href="https://wa.me/233503841074" target="_blank">WhatsApp</a>
        <a href="https://github.com/Jganyo-dotcom/" target="_blank">GitHub</a>
      </div>
    </footer>

    <div id="passwordModal" class="slide-modal">
      <div class="slide-modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        <h2>Change Password</h2>
        <form id="changePasswordForm">
          <div class="form-group">
            <label for="currentPassword">Old Password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required />
          </div>
          <button type="submit" class="btn-primary">Update Password</button>
        </form>
      </div>
    </div>

    <script src="global-sidebar.js"></script>
    <script src="MA.js"></script>
  </body>
</html>
