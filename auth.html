<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Page</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="container">
      <!-- Register Form -->
      <form id="registerForm" class="form hidden">
        <h2>Register</h2>
        <input type="text" id="regUsername" placeholder="Username" required />
        <input type="text" id="regName" placeholder="Full Name" required />
        <input type="text" id="regEmail" placeholder="email" required />
        <select id="regOrg" name="regOrg" required>
          <option value="">-- Select Organization --</option>
          <option value="Main">Main</option>
          <option value="Visa">Visa-KNUST</option>
          <option value="VisaUOE">Visa-UOE</option>
          <option value="Teens">Teens Chapel</option>
        </select>
        <input
          type="password"
          id="regPassword"
          placeholder="Password"
          required
        />

        <input
          type="password"
          id="regConfirmPassword"
          placeholder="Confirm Password"
          required
        />
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="#" id="loginLink">Login</a></p>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="form">
        <h2>Login</h2>
        <p id="loginMessage" class="form-message"></p>
        <input type="text" id="loginUsername" placeholder="Username" required />
        <div class="password-wrapper">
  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    required
  />
  <span class="toggle-password" onclick="togglePassword()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
  </span>
</div>

        <button type="submit">Sign In</button>
        <p>
          <a href="#" id="forgotPassword">forgotPassword?</a>
        </p>
        <p>
          Don’t have an account?
          <a href="#" id="registerLink">Register</a>
        </p>
      </form>
    </div>
    <div class="loader-overlay" id="loaderOverlay">
      <div class="loader">
        <div class="spinner"></div>
        <span class="loading-text">Loading...</span>
      </div>
    </div>

    <script src="auth.js"></script>

</html>
