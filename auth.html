<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Page</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="container">
      <form id="loginForm" class="form">
        <h2>Login</h2>

        <!-- Social Login Options Block -->
        <div class="social-login-container">
          <button type="button" class="btn-social google-btn">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              xmlns="http://w3.org"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                fill="#EA4335"
              />
            </svg>
            Continue with Google
          </button>
          <button type="button" class="btn-social apple-btn">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              xmlns="http://w3.org"
              fill="currentColor"
            >
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.38z"
              />
            </svg>
            Continue with Apple
          </button>
        </div>

        <div class="divider">
          <span>or log in with email</span>
        </div>

        <p id="loginMessage" class="form-message"></p>
        <input type="text" id="loginUsername" placeholder="Username" required />
        <div class="password-wrapper">
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <span class="toggle-password" onclick="togglePassword()">
            <svg
              xmlns="http://w3.org"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              style="width: 20px; height: 20px"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </span>
        </div>
        <button type="submit">Sign In</button>
        <p><a href="#" id="forgotPassword">forgotPassword?</a></p>
      </form>

      <form id="verifyForm" class="form hidden">
        <h2>Verify Account</h2>
        <p class="form-instruction">
          Please enter the 6-digit verification code sent to your email inbox.
        </p>
        <p id="verifyMessage" class="form-message"></p>
        <input
          type="text"
          id="verifyOtp"
          placeholder="6-Digit OTP Code"
          maxlength="6"
          pattern="\d{6}"
          inputmode="numeric"
          required
        />
        <button type="submit">Confirm Code</button>
        <p><a href="#" id="backToLoginLink">Back to Login</a></p>
      </form>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
      <div class="loader">
        <div class="spinner"></div>
        <span class="loading-text">Loading...</span>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
