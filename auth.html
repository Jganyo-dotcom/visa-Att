<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - ElikemTech Attendance Portal</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="container">
      <!-- Main Content Card wrapper -->
      <main class="auth-card">
        <!-- Login Form Interface -->
        <form id="loginForm" class="form" aria-labelledby="loginHeading">
          <div class="form-header">
            <h2 id="loginHeading">ElikemTech Attendance</h2>
            <p class="form-subtitle">Enter your credentials to sign into the system</p>
          </div>

          <!-- Live Feedback Region for Validation Messaging -->
          <div id="loginMessage" class="form-message" aria-live="polite"></div>

          <div class="input-group">
            <label for="loginUsername" class="sr-only">Username</label>
            <input
              type="text"
              id="loginUsername"
              placeholder="Username"
              autocomplete="username"
              required
            />
          </div>

          <div class="input-group">
            <label for="loginPassword" class="sr-only">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
                aria-label="Toggle password visibility"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  width="20"
                  height="20"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
          <p class="form-footer-link">
            <a href="#" id="forgotPassword">Forgot Password?</a>
          </p>
        </form>

        <!-- Verification Multi-Factor Form -->
        <form
          id="verifyForm"
          class="form hidden"
          aria-labelledby="verifyHeading"
        >
          <div class="form-header">
            <h2 id="verifyHeading">Verify Account</h2>
            <p id="otpInstructions" class="form-instruction">
              Please enter the 6-digit verification code sent to your email inbox.
            </p>
          </div>

          <div id="verifyMessage" class="form-message" aria-live="polite"></div>

          <div class="input-group">
            <label for="verifyOtp" class="sr-only">6-Digit OTP Code</label>
            <input
              type="text"
              id="verifyOtp"
              placeholder="000000"
              maxlength="6"
              pattern="\d{6}"
              inputmode="numeric"
              aria-describedby="otpInstructions"
              required
            />
          </div>

          <button type="submit" class="btn-submit">Confirm Code</button>
          <p class="form-footer-link">
            <a href="#" id="backToLoginLink">Back to Login</a>
          </p>
        </form>

        <footer style="margin-top: 20px; text-align: center; font-size: 12px; color: #777;">
          <p>© 2026 ElikemTech - System Attendance Portal</p>
        </footer>
      </main>
    </div>

    <!-- Loader Overlay Context Layer -->
    <div id="loaderOverlay" class="loader-overlay" aria-hidden="true">
      <div class="loader-content-wrap">
        <div class="spinner"></div>
        <span class="loading-text">Loading...</span>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
